name: Deploy produccion

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Desplegar con Docker
        run: |
          if [[ ! -f .env ]]; then
            echo "Falta .env en el servidor. Crealo antes del primer deploy."
            exit 1
          fi
          docker compose build
          docker compose up -d
          docker compose ps
