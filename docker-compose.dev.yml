services:
  pedidos:
    build: .
    container_name: pedidos-as400-dev
    ports:
      - "${FLASK_PORT:-5100}:5100"
    env_file:
      - .env
    environment:
      FLASK_DEBUG: "true"
      APP_HISTORIAL_FILE: /app/data/historial_operaciones.json
      APP_ASIENTOS_EJEMPLOS_FILE: /app/data/asientos_ejemplos.json
    volumes:
      - ./app.py:/app/app.py
      - ./as400_api.py:/app/as400_api.py
      - ./config.py:/app/config.py
      - ./templates:/app/templates
      - ./static:/app/static
      - ./data:/app/data
    command: python app.py
