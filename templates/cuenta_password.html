<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña · Pedidos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1e7883;
            color: white;
            padding: 1rem 1.5rem;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        .header-link {
            color: white;
            text-decoration: none;
            border: 2px solid rgba(255, 255, 255, .5);
            border-radius: 8px;
            padding: .4rem .75rem;
            font-size: .9rem;
            font-weight: 700;
        }

        .header-link:hover {
            background: rgba(255, 255, 255, .15);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 18px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .06);
        }

        .card h2 {
            margin: 0 0 .35rem;
            font-size: 1.2rem;
        }

        .card p {
            margin: 0 0 1rem;
            color: #6b7280;
            font-size: .95rem;
        }

        .campo {
            margin-bottom: 1rem;
        }

        .campo label {
            display: block;
            font-size: .85rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: .35rem;
        }

        .campo input {
            width: 100%;
            padding: .75rem .9rem;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
        }

        .campo input:focus {
            outline: none;
            border-color: #1e7883;
            box-shadow: 0 0 0 3px rgba(30, 120, 131, .15);
        }

        .mensaje {
            padding: .85rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: .95rem;
        }

        .mensaje.ok {
            background: #d1fae5;
            color: #065f46;
        }

        .mensaje.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: .85rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            background: #1e7883;
            cursor: pointer;
        }

        .btn:hover {
            background: #18656e;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">
            <h1>Cambiar contraseña</h1>
            <a class="header-link" href="{{ url_for('pedido') }}">Volver al pedido</a>
        </div>
    </header>

    <main>
        <form class="card" method="POST">
            <h2>{{ usuario }}</h2>
            <p>Introduce tu contraseña actual y la nueva contraseña.</p>

            {% if ok %}
            <div class="mensaje ok">{{ ok }}</div>
            {% endif %}

            {% if error %}
            <div class="mensaje error">{{ error }}</div>
            {% endif %}

            <div class="campo">
                <label for="password_actual">Contraseña actual</label>
                <input type="password" id="password_actual" name="password_actual" required autocomplete="current-password">
            </div>

            <div class="campo">
                <label for="password_nueva">Nueva contraseña</label>
                <input type="password" id="password_nueva" name="password_nueva" required autocomplete="new-password">
            </div>

            <div class="campo">
                <label for="password_nueva_confirmar">Repetir nueva contraseña</label>
                <input type="password" id="password_nueva_confirmar" name="password_nueva_confirmar" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn">Guardar contraseña</button>
        </form>
    </main>

</body>

</html>
