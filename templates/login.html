<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Acceso · Pedidos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1e7883;
            color: white;
            padding: 1rem 1.5rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 18px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .06);
        }

        .login-card h2 {
            margin: 0 0 1rem;
            font-size: 1.2rem;
        }

        .campo {
            margin-bottom: 1rem;
        }

        .campo label {
            display: block;
            font-size: .85rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: .35rem;
        }

        .campo input {
            width: 100%;
            padding: .75rem .9rem;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
        }

        .campo input:focus {
            outline: none;
            border-color: #1e7883;
            box-shadow: 0 0 0 3px rgba(30, 120, 131, .15);
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            padding: .85rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: .95rem;
        }

        .btn-login {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: .85rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            background: #1e7883;
            cursor: pointer;
        }

        .btn-login:hover {
            background: #18656e;
        }
    </style>
</head>

<body>

    <header>
        <h1>Pedido rápido</h1>
    </header>

    <main>
        <form class="login-card" method="POST" action="{{ url_for('login', next=next) }}">
            <h2>Iniciar sesión</h2>

            {% if error %}
            <div class="error-box">{{ error }}</div>
            {% endif %}

            <div class="campo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </main>

</body>

</html>
